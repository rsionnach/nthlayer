# Dependabot — dependency-bump automation. GitHub-native; no Mend.io
# account required. Auto-merge rules live in
# .github/workflows/dependabot-automerge.yml; nthlayer-* updates (the only
# ones the uv entry below can raise) always need review.
version: 2

updates:
  # Meta-package pyproject lives at meta-package/pyproject.toml. The
  # repo root has no Python source.
  - package-ecosystem: uv
    directory: /meta-package
    # The tiers are compatible ranges (opensrm-z1kq): only touch one when a
    # release falls outside it, i.e. a new major, which needs review.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Dublin
    labels:
      - dependencies
    # With ranges and no lockfile, patch and minor releases need no PR (they
    # are already in range), so the only PRs are majors. Grouped, so tiers
    # moving majors together arrive as one review. The meta-package has no
    # dev dependencies, so it has no dev group.
    groups:
      nthlayer-ecosystem:
        patterns:
          - "nthlayer-*"
        update-types:
          - "major"
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Dublin
    labels:
      - dependencies
      - github-actions
    groups:
      ci-actions:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
