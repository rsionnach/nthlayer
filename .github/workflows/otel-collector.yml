name: otel-collector

# opensrm-s4ui: test/otel-collector.yaml turns the A1 §4 log events into the
# §4.5 nthlayer_* counters for the demo and test stack. This runs the
# collector image pinned in test/docker-compose.yml with that config, sends
# a fixed set of OTLP log events and asserts every series' name, labels and
# count. It also runs test/fake-service.py as an ai-gate (published
# nthlayer-common[otel] from PyPI, in an ephemeral uv env) against the
# collector, and the pinned Prometheus over the collector to evaluate
# demo/specs/fraud-detect.yaml's SLI query and test/rules/demo-alerts.yml's
# nthlayer_* rules. Needs Docker and uv (on the runner); no sibling
# checkouts. The test fails, never skips, when Docker, uv or a container is
# unavailable.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: install uv
        uses: astral-sh/setup-uv@v6

      - name: collector config -> nthlayer_* series
        run: >
          uv run --isolated --no-project --python 3.11
          --with pytest --with pyyaml
          pytest -q -rA test/test_otel_collector.py
