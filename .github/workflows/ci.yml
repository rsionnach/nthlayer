name: CI

# CI gates for the front-door repo.
#
# Post-consolidation this repo hosts only integration- and demo-shaped
# Python helpers at the root — implementation lives in
# nthlayer-{common,core,workers,bench,generate} (each with its own CI).
# The original ci.yml ran ruff/mypy/pytest against src/ tests/ examples/
# paths that no longer exist; it failed every push from 2026-04-26 onward
# until this rewrite (opensrm-0buj).
#
# What CI does for the front-door now:
#   - shell-syntax (this workflow): bash -n on every demo/ and test/ shell script.
#   - python-lint  (this workflow): ruff check on the 5 root helpers (opensrm-u5dw.1).
#   - .github/workflows/error-budget-seam.yml: generate's error-budget rules vs
#     measure's queries over real manifests (opensrm-h0at); nightly + PR.
#   - .github/workflows/meta-resolve.yml: every meta-package tier at its newest
#     release, and that release in range (opensrm-z1kq); nightly + PR.
#   - .github/workflows/docs.yml: mkdocs build --strict on docs-site/.
#   - .github/workflows/demo-paths.yml: cmd_start path-resolution test (opensrm-oey5).
#   - .github/workflows/integration-three-tier.yml: nightly cross-repo smoke.
#   - .github/workflows/release.yml: meta-v* tag publish to PyPI.
#
# Per-component Python testing remains the responsibility of each sibling repo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: bash -n on demo/, test/ and scripts/ shell scripts
        run: |
          set -e
          fail=0
          while IFS= read -r script; do
            if bash -n "$script"; then
              echo "  OK    $script"
            else
              echo "  FAIL  $script"
              fail=1
            fi
          done < <(find demo test scripts -maxdepth 2 -name '*.sh' -type f | sort)
          exit "$fail"

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: install uv
        uses: astral-sh/setup-uv@v6

      - name: ruff check on test/, demo/ and scripts/ helpers
        run: uvx ruff@0.15.15 check test/ demo/ scripts/

      # eco-doctor's own regression test (opensrm-8hn3). Builds synthetic git
      # fixtures in a temp dir — no network, no Docker, a few seconds. Runs here
      # rather than as its own workflow because it has no external deps; the
      # dedicated workflows (demo-paths, demo-start-lock) exist for tests that do.
      - name: eco-doctor regression test
        run: bash test/test_eco_doctor.sh

      # r5_baseline's tests (opensrm-6kqs.1). Standard library plus pytest, over
      # synthetic fixtures, one per archive pattern (opensrm-6kqs.8); no network.
      - name: r5-baseline tests
        run: uv run --no-project --with pytest pytest -q test/test_r5_baseline.py

      # Again on 3.9: the workspace shim (.claude/bin/r5-baseline.sh) runs the
      # system python3, and before 3.11 fromisoformat cannot read a "Z"
      # timestamp, so the script's own normalisation is exercised only here.
      - name: r5-baseline tests (Python 3.9, as the shim runs)
        run: uv run --no-project --python 3.9 --with pytest pytest -q test/test_r5_baseline.py

      # r5_corpus's tests (opensrm-6kqs.2): synthetic git repos, archive
      # records and private-archive files built in tmp_path; no network. On
      # 3.9 too, since it imports r5_baseline and runs under the same shim.
      - name: r5-corpus tests
        run: uv run --no-project --with pytest pytest -q test/test_r5_corpus.py
      - name: r5-corpus tests (Python 3.9, as the shim runs)
        run: uv run --no-project --python 3.9 --with pytest pytest -q test/test_r5_corpus.py
