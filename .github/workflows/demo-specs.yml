name: demo-specs

# opensrm-gx3e: every manifest in demo/specs loads through the PUBLISHED
# nthlayer-common. Every demo SLO must declare indicator.query, and the loaded
# SLOs must be exactly the file's, each with that query. common's own
# copy of this check reads a snapshot since opensrm-t93o, so this is the only
# place a demo spec the parser mishandles is caught before the integration run.
#
# opensrm-jg1e: the same files also migrate with the PUBLISHED
# nthlayer-generate (`nthlayer migrate-manifest`), keeping their SLOs.
# generate's own test of this runs on vendored copies, which do not follow a
# change made here.
#
# Nightly as well as on PRs: a nthlayer-common or nthlayer-generate release
# can break either check with no front-door change, and without a schedule
# the first sign would be an unrelated PR going red.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "45 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: install uv
        uses: astral-sh/setup-uv@v6

      # The version is printed because the install is unpinned: if
      # nthlayer-common ever drops Python 3.11, uv would quietly resolve an
      # older release that still supports it, and the log is where that shows.
      # One uv run for both commands, so the version printed is the one tested.
      - name: demo/specs load through published nthlayer-common
        run: |
          uv run --isolated --no-project --python 3.11 \
            --with nthlayer-common --with pytest --with pyyaml \
            sh -c 'python -c "from importlib.metadata import version as v; print(\"nthlayer-common\", v(\"nthlayer-common\"))" && pytest -q test/test_demo_specs_load.py'

      # nthlayer-generate brings the nthlayer-common it resolves with, so this
      # is the pair a user installing generate today would get. It runs even
      # when the load step failed, so one break does not hide the other.
      - name: demo/specs migrate with published nthlayer-generate
        if: ${{ !cancelled() }}
        run: |
          uv run --isolated --no-project --python 3.11 \
            --with nthlayer-generate --with pytest --with pyyaml \
            sh -c 'python -c "from importlib.metadata import version as v; print(\"nthlayer-generate\", v(\"nthlayer-generate\"), \"nthlayer-common\", v(\"nthlayer-common\"))" && pytest -q test/test_demo_specs_migrate.py'
