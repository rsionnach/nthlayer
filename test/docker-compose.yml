version: "3.8"

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    # Host ports default to the demo's; a harness that must not collide with
    # a running stack overrides them (test/integration-thresholds.sh).
    ports:
      - "${NTHLAYER_TEST_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.cors.origin=.*
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  otel-collector:
    # A1 §4.5 counters from NthLayer's OTLP log events [opensrm-s4ui]:
    # gRPC 4317 (nthlayer_common.telemetry), HTTP 4318, Prometheus 8889.
    # The pin is read by test/test_otel_collector.py too: change it here only.
    image: otel/opentelemetry-collector-contrib:0.163.2
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    ports:
      - "${NTHLAYER_TEST_OTLP_GRPC_PORT:-4317}:4317"
      - "${NTHLAYER_TEST_OTLP_HTTP_PORT:-4318}:4318"
      - "${NTHLAYER_TEST_OTEL_METRICS_PORT:-8889}:8889"
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_CORS_ALLOWED_ORIGINS=*
      - GF_SECURITY_CORS_ALLOWED_METHODS=GET,POST,OPTIONS
      - GF_SECURITY_CORS_ALLOWED_HEADERS=Content-Type
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

# webhook-receiver runs on the host, not in Docker.
# Start it with: python3 test/webhook-receiver.py
