[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nthlayer"
version = "1.0.2"
description = "NthLayer ecosystem meta-package — installs all tiers (core, workers, bench, generate)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "NthLayer", email = "noreply@nthlayer.io" },
]
keywords = [
    "sre",
    "reliability",
    "slo",
    "opensrm",
    "observability",
    "prometheus",
    "grafana",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
# Compatible ranges, not exact pins (opensrm-z1kq, ruling 2026-11-02): each
# tier's floor is the release current when the range was last set, and its
# ceiling the next major. Patch and minor releases reach `pip install nthlayer`
# without a meta release; a major needs one, deliberately, since it can break
# the other tiers. Exact pins went stale for majors at a time (1.0.2 still
# installed core/workers/bench 1.6.0). scripts/meta-resolve-check.sh, run
# nightly, fails if a tier would be installed below its newest in-range
# release, or if a tier's newest release is outside its range.
dependencies = [
    "nthlayer-core>=4.0.10,<5",
    "nthlayer-workers>=4.0.2,<5",
    "nthlayer-bench>=1.7.17,<2",
    "nthlayer-generate>=4.0.10,<5",
]

[project.urls]
Homepage = "https://github.com/rsionnach/nthlayer"
Documentation = "https://github.com/rsionnach/nthlayer"
Repository = "https://github.com/rsionnach/nthlayer"
Changelog = "https://github.com/rsionnach/nthlayer/releases"

# No [project.scripts] — the meta-package is dependency-only.
# CLI binaries come from the sub-packages: nthlayer and nthlayer-generate
# (generate), nthlayer-core (core >= 4.0.0), nthlayer-workers and
# nthlayer-learn (workers), nthlayer-bench.

[tool.setuptools]
# No Python source — meta-package is metadata-only.
packages = []
